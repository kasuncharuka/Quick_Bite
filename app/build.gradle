plugins {
    alias(libs.plugins.android.application)
    id("com.google.gms.google-services")
}

def localProps = new Properties()
localProps.load(new FileInputStream(rootProject.file("local.properties")))

android {
    namespace 'lk.kcd.quickbite'
    compileSdk 36

    defaultConfig {
        applicationId "lk.kcd.quickbite"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ✅ buildConfigField goes HERE, inside defaultConfig
        buildConfigField "String", "PAYHERE_MERCHANT_ID",     "\"${localProps['1223975']}\""
        buildConfigField "String", "PAYHERE_MERCHANT_SECRET", "\"${localProps['MjA2ODg4NjYzNTc2NzI5NjUwMzExMDgxNzM3MDE0NTM0NTA2NDA=']}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true   // ✅ explicitly enable BuildConfig generation
    }

    buildToolsVersion '35.0.0'
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.preference

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // Image loading
    implementation libs.picasso
    implementation libs.glide

    // Firebase (BOM manages versions for analytics/auth/firestore/storage)
    implementation(platform(libs.firebase.bom))
    implementation(libs.firebase.analytics)
    implementation(libs.firebase.auth)
    implementation(libs.firebase.firestore)
    implementation(libs.firebase.storage)

    // UI
    implementation libs.dotsindicator

    // PayHere
    implementation libs.payhere.android.sdk

    // Gson
    implementation libs.gson

    // Lombok
    compileOnly(libs.lombok)
    annotationProcessor(libs.lombok)
    implementation libs.play.services.maps
    implementation libs.play.services.location
}